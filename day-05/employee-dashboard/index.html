<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Employee Dashboard</title><link rel="stylesheet" href="style.css"></head><body>
<main class="container"><header><div><p class="eyebrow">DAY 05 • VANILLA JAVASCRIPT</p><h1>Employee Dashboard</h1><p class="muted">Search, filter, sort, and manage employee records.</p></div><button id="addButton" class="primary">+ Add employee</button></header>
<section class="metrics"><article><span>Total employees</span><strong id="totalEmployees">0</strong></article><article><span>Average salary</span><strong id="averageSalary">₹0</strong></article><article><span>Departments</span><strong id="departmentCount">0</strong></article></section>
<section class="panel"><div class="toolbar"><input id="searchInput" aria-label="Search employees" placeholder="Search name, email, position…"><select id="departmentFilter"><option value="">All departments</option></select><select id="sortSelect"><option value="name-asc">Name: A–Z</option><option value="salary-desc">Salary: high to low</option><option value="salary-asc">Salary: low to high</option><option value="id-desc">Newest first</option></select></div><p id="message" role="status"></p><div class="table-wrap"><table><thead><tr><th>Employee</th><th>Department</th><th>Position</th><th>Salary</th><th>Actions</th></tr></thead><tbody id="employeeRows"></tbody></table></div></section></main>
<dialog id="employeeDialog"><form id="employeeForm" method="dialog"><div class="dialog-header"><h2 id="formTitle">Add employee</h2><button type="button" class="icon" id="closeDialog" aria-label="Close">×</button></div><input type="hidden" id="employeeId"><label>Name<input id="name" required minlength="2"></label><label>Email<input id="email" type="email" required></label><label>Department<input id="department" required></label><label>Position<input id="position" required></label><label>Salary<input id="salary" type="number" min="1" required></label><p id="formError" class="error"></p><div class="dialog-actions"><button type="button" id="cancelButton">Cancel</button><button class="primary" type="submit">Save employee</button></div></form></dialog>
<dialog id="detailsDialog"><div id="detailsContent"></div><button id="closeDetails">Close</button></dialog><script src="app.js"></script></body></html>
